name: Manual release and Docker build
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example v1.0.0'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: manual-release
  cancel-in-progress: false
jobs:
  release:
    if: github.actor == 'Cyberhunter88' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true
      - name: Validate release input and source
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          test "${VERSION#v}" = "$(go run ./cmd/validator version)"
          test -z "$(git ls-remote --tags origin "refs/tags/$VERSION")"
          test -z "$(git status --porcelain)"
          node scripts/check-secrets.mjs --tracked --history
          node --test scripts/check-secrets.test.mjs
          go test -race ./...
          go vet ./...
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish versioned image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/cyberhunter88/restic-backup-validator:${{ inputs.version }}
          provenance: true
      - name: Verify published image
        env:
          VERSION: ${{ inputs.version }}
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          image="ghcr.io/cyberhunter88/restic-backup-validator:$VERSION"
          docker buildx imagetools inspect --raw "$image" > /tmp/image-index.json
          jq -e '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | (index("amd64") != null and index("arm64") != null)' /tmp/image-index.json
          actual="$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')"
          test "$actual" = "$EXPECTED_DIGEST"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ github.sha }}
        run: gh release create "$VERSION" --target "$COMMIT" --title "Restic Backup Validator $VERSION" --generate-notes
