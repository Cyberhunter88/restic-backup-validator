name: Manual release and Docker build
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example v1.0.0'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: manual-release
  cancel-in-progress: false
jobs:
  release:
    if: github.actor == 'Cyberhunter88' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.3'
          cache: true
      - name: Validate release input and source
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          test "${VERSION#v}" = "$(go run ./cmd/validator version)"
          test -z "$(git ls-remote --tags origin "refs/tags/$VERSION")"
          test -z "$(git status --porcelain)"
          node scripts/check-secrets.mjs --tracked --history
          node --test scripts/check-secrets.test.mjs
          go test -race ./...
          go vet ./...
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish versioned image
        id: build
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/cyberhunter88/restic-backup-validator:${{ inputs.version }}
          provenance: true
      - name: Verify published image
        env:
          VERSION: ${{ inputs.version }}
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          image="ghcr.io/cyberhunter88/restic-backup-validator:$VERSION"
          docker buildx imagetools inspect --raw "$image" > /tmp/image-index.json
          jq -e '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | (index("amd64") != null and index("arm64") != null)' /tmp/image-index.json
          actual="$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')"
          test "$actual" = "$EXPECTED_DIGEST"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ github.sha }}
        run: gh release create "$VERSION" --target "$COMMIT" --title "Restic Backup Validator $VERSION" --generate-notes
