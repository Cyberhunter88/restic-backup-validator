name: PR checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true
      - name: Install restic for integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y restic
      - name: Verify formatting
        run: test -z "$(gofmt -l ./cmd ./internal)"
      - name: Secret scan
        run: node scripts/check-secrets.mjs --tracked --history
      - name: Secret scanner regression tests
        run: node --test scripts/check-secrets.test.mjs
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Compile
        run: go build ./cmd/validator
