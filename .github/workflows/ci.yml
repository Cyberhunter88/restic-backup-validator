name: PR checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.3'
          cache: true
      - name: Install restic for integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y restic
      - name: Verify formatting
        run: test -z "$(gofmt -l ./cmd ./internal)"
      - name: Secret scan
        run: node scripts/check-secrets.mjs --tracked --history
      - name: Secret scanner regression tests
        run: node --test scripts/check-secrets.test.mjs
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Compile
        run: go build ./cmd/validator
